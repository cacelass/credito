[project]
name = "credito"
version = "0.1.0"
description = "Predicción de propensión a suscribir depósito a plazo (UCI Bank Marketing) con Random Forest y métricas persistidas."
authors = [
  { name = "Alejandro Cancelas Chapela" }
]
readme = "README.md"
requires-python = ">= 3.10"  # He actualizado esto para evitar problemas con Python muy antiguos
license = {text = ""}
dependencies = [
  "invoke",
  "jupyter",
  "jupyterlab",
  "matplotlib",
  "numpy",
  "scikit-learn",
  "pandas",
  "seaborn",
  "joblib",
  "sphinx>=8.1.3",
]

[tool.setuptools]
packages = ["credito"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
